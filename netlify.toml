[build]
  command = "npm run build"
  publish = "public"
  functions = "functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

  [start]
  base    = "."
  publish = "start"
  command = "npm run start"
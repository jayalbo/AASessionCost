<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agora Analytics Cost Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {}
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        [data-theme="dark"] {
            color-scheme: dark;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .dark .spinner {
            border-color: #374151;
            border-top-color: #60a5fa;
        }
        .sid-text {
            word-break: break-all;
            overflow-wrap: break-word;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen transition-colors duration-200">
    <div class="container mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-8">
            <a href="https://github.com/jayalbo/AASessionCost" target="_blank" class="text-gray-800 dark:text-white hover:text-gray-600 dark:hover:text-gray-300">
                <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24">
                    <path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"></path>
                </svg>
            </a>
            <h1 class="text-4xl font-bold text-gray-800 dark:text-white text-center flex-1">Agora Analytics Cost Calculator</h1>
            <button id="themeToggle" class="p-2 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors duration-200">
                <svg class="w-6 h-6 text-gray-800 dark:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path class="dark:hidden" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    <path class="hidden dark:block" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                </svg>
            </button>
        </div>
        
        <div class="max-w-2xl mx-auto bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6 transition-colors duration-200">
            <form id="analyticsForm" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Customer ID</label>
                        <input type="text" id="customerId" name="customerId" required
                            class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Customer Secret</label>
                        <input type="password" id="customerSecret" name="customerSecret" required
                            class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">App ID</label>
                        <input type="text" id="appId" name="appId" required
                            class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Call ID</label>
                        <input type="text" id="callId" name="callId" required
                            class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Start Time</label>
                        <input type="text" id="startTime" name="startTime" required
                            class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">End Time</label>
                        <input type="text" id="endTime" name="endTime" required
                            class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    </div>
                </div>

                <div class="flex items-center">
                    <input type="checkbox" id="multiHost" name="multiHost"
                        class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 dark:border-gray-600 rounded">
                    <label for="multiHost" class="ml-2 block text-sm text-gray-700 dark:text-gray-300">Multi Host</label>
                </div>

                <div class="flex justify-center">
                    <button type="submit" id="submitButton"
                        class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors duration-200">
                        Calculate Cost
                    </button>
                </div>
            </form>
        </div>

        <div id="loading" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
            <div class="text-center">
                <div class="spinner mx-auto"></div>
                <p class="mt-4 text-white text-lg">Calculating costs...</p>
            </div>
        </div>

        <div id="results" class="max-w-4xl mx-auto mt-8 bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6 hidden transition-colors duration-200">
            <h2 class="text-2xl font-bold mb-4 text-gray-800 dark:text-white">Results</h2>
            <div class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-gray-50 dark:bg-gray-700 p-4 rounded-lg">
                        <h3 class="text-lg font-semibold text-gray-700 dark:text-gray-300">Call Details</h3>
                        <p class="text-sm text-gray-600 dark:text-gray-400">Call ID: <span id="result-callId" class="font-mono"></span></p>
                        <p class="text-sm text-gray-600 dark:text-gray-400">Channel: <span id="result-channel" class="font-mono"></span></p>
                        <p class="text-sm text-gray-600 dark:text-gray-400">Total Users: <span id="result-users" class="font-mono"></span></p>
                        <p class="text-sm text-gray-600 dark:text-gray-400">Total Minutes: <span id="result-minutes" class="font-mono"></span></p>
                    </div>
                    <div class="bg-gray-50 dark:bg-gray-700 p-4 rounded-lg">
                        <h3 class="text-lg font-semibold text-gray-700 dark:text-gray-300">Cost Details</h3>
                        <p class="text-sm text-gray-600 dark:text-gray-400">Pricing Tier: <span id="result-tier" class="font-mono"></span></p>
                        <p class="text-sm text-gray-600 dark:text-gray-400">Total Cost: <span id="result-cost" class="font-mono"></span></p>
                        <p class="text-sm text-gray-600 dark:text-gray-400">Resolution: <span id="result-resolution" class="font-mono"></span></p>
                    </div>
                </div>
                <div class="bg-gray-50 dark:bg-gray-700 p-4 rounded-lg">
                    <h3 class="text-lg font-semibold text-gray-700 dark:text-gray-300 mb-2">Speakers</h3>
                    <div id="result-speakers" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                </div>
                <p class="text-sm text-gray-500 dark:text-gray-400 italic" id="result-disclaimer"></p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Theme toggle functionality
            const themeToggle = document.getElementById('themeToggle');
            const html = document.documentElement;
            
            // Check for saved theme preference
            const savedTheme = localStorage.getItem('theme') || 'light';
            html.classList.toggle('dark', savedTheme === 'dark');
            
            themeToggle.addEventListener('click', () => {
                html.classList.toggle('dark');
                localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
            });

            // Initialize date pickers with dark mode support
            const datePickerConfig = {
                enableTime: true,
                dateFormat: "U",
                time_24hr: true,
                theme: html.classList.contains('dark') ? 'dark' : 'light'
            };
            
            flatpickr("#startTime", datePickerConfig);
            flatpickr("#endTime", datePickerConfig);

            // Handle form submission
            document.getElementById('analyticsForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const loading = document.getElementById('loading');
                const submitButton = document.getElementById('submitButton');
                loading.classList.remove('hidden');
                submitButton.disabled = true;
                
                const formData = new FormData(e.target);
                const params = new URLSearchParams();
                for (let [key, value] of formData.entries()) {
                    if (key === 'multiHost') {
                        params.append(key, value === 'on');
                    } else {
                        params.append(key, value);
                    }
                }

                try {
                    // Determine if we're in development or production
                    const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
                    const apiUrl = isLocalhost ? '/api/analytics' : '/.netlify/functions/analytics';
                    
                    const response = await fetch(`${apiUrl}?${params.toString()}`);
                    const data = await response.json();
                    
                    // Update results
                    document.getElementById('results').classList.remove('hidden');
                    document.getElementById('result-callId').textContent = data.call_id;
                    document.getElementById('result-channel').textContent = data.channel_name;
                    document.getElementById('result-users').textContent = data.total_users_in_call;
                    document.getElementById('result-minutes').textContent = data.total_accumulated_minutes;
                    document.getElementById('result-tier').textContent = data.pricing_tier;
                    document.getElementById('result-cost').textContent = `$${data.total_cost.toFixed(2)}`;
                    document.getElementById('result-resolution').textContent = data.aggregated_resolution;
                    document.getElementById('result-disclaimer').textContent = data.disclaimer;

                    // Update speakers with grid layout
                    const speakersContainer = document.getElementById('result-speakers');
                    speakersContainer.innerHTML = data.speakers.map(speaker => `
                        <div class="bg-white dark:bg-gray-800 p-4 rounded-lg border border-gray-200 dark:border-gray-600">
                            <p class="text-sm text-gray-700 dark:text-gray-300">UID: ${speaker.uid}</p>
                            <p class="text-sm text-gray-700 dark:text-gray-300">SID: <span class="sid-text">${speaker.sid}</span></p>
                            ${speaker.speaker_resolution ? `
                                <p class="text-sm text-gray-700 dark:text-gray-300">Resolution: ${speaker.speaker_resolution.width}x${speaker.speaker_resolution.height}</p>
                            ` : ''}
                        </div>
                    `).join('');
                } catch (error) {
                    console.error('Error:', error);
                    alert('An error occurred while fetching the data.');
                } finally {
                    loading.classList.add('hidden');
                    submitButton.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
